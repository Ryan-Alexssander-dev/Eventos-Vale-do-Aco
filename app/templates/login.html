<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="/app/static/css/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
    />
  </head>

  <body>
    <header>
      <div class="container-fluid">
        <nav class="navbar bg-primary navbar-dark">
          <a href="index.html" class="navbar-brand ">Eventos | Vale do Aço</a>
        </nav>
      </div>
      
    </header>

    <main>
      <section>
        <div class="container w-50 mt-5">
          <form>
            <h1 class="text-center">Login</h1>

            <label for="inputPassword5" class="form-label mt-5">E-mail</label>
            <input
              type="email"
              id="inputPassword5"
              class="form-control border-2"
              placeholder="Digite seu email"
            />

            <label for="inputPassword5" class="form-label mt-3">Senha</label>
            <input
              type="password"
              id="inputPassword5"
              class="form-control border-2"
              placeholder="Digite sua senha"
            />

            <button class="btn btn-primary mt-5" type="submit">Button</button>
          </form>

          
          <p>
            <a href="">Esqueceu a senha?</a>
          </p>
          <p>
            Não possui cadastro? <a href="cadastrar.html">Cadastre-se</a>.
          </p>
        </div>

      </section>
    </main>
    
  </body>
</html>
